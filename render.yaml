services:
  # Unified Full-Stack Web Service (FastAPI serves both API and Vite React Frontend together)
  # When the website loads, backend is already active instantly with zero separate startup delay.
  - type: web
    name: coldreach-app
    env: python
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cold_outreach_db
      - key: JWT_SECRET
        generateValue: true
      - key: LANGCHAIN_TRACING_V2
        value: "false"
